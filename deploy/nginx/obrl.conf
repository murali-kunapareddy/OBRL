# /etc/nginx/sites-available/obrl  (install.sh replaces obrl.example.com with your domain;
# certbot then adds the HTTPS server block and certificate lines)

# Second line of defence for the reader, per client IP (the app also limits per user).
limit_req_zone $binary_remote_addr zone=obrl_reader:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=obrl_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name obrl.example.com;

    client_max_body_size 210m;   # keep a little above Obrl:MaxUploadMegabytes
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /read/ {
        limit_req zone=obrl_reader burst=30 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/obrl-proxy.conf;
    }

    location = /Identity/Account/Login {
        limit_req zone=obrl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/obrl-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/obrl-proxy.conf;
    }
}

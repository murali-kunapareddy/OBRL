# /etc/systemd/system/obrl.service.d/remote-storage.conf
# Use when the library (Obrl__StorageRoot) is on another server, mounted at /mnt/obrl-library.
# See "Keep the library on another server" in README.md. Change the path if you mount it elsewhere.
[Unit]
# Start only once the share is mounted, and stop if it goes away, so OBRL never writes books
# into the empty mount-point folder on the local disk.
RequiresMountsFor=/mnt/obrl-library
After=remote-fs.target

[Service]
ReadWritePaths=/mnt/obrl-library
